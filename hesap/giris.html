<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Giriş — MarketPOS Hesabım</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="../favicon.svg?v=20260530" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../style.css?v=20260730" />
  <link rel="stylesheet" href="portal.css?v=20260730" />
  <link rel="stylesheet" href="../saas.css?v=20260730" />
</head>
<body>
  <div class="bg-aurora" aria-hidden="true"><span class="aurora a1"></span><span class="aurora a2"></span></div>
  <div class="bg-grid" aria-hidden="true"></div>

  <div class="portal-auth-page">
    <div class="portal-auth-card">
      <a href="../index.html" class="portal-auth-logo"><img src="../assets/logo-lockup.png?v=20260530" alt="MarketPOS" width="160" height="24" /></a>
      <h1>Hesabınıza giriş</h1>
      <p class="portal-sub">Mağaza bilgilerinizi, lisans durumunuzu ve kayıtlı cihazlarınızı web üzerinden yönetin.</p>
      <p class="portal-alert portal-alert-info" style="margin-bottom:1.25rem">
        Web hesabı ile Windows uygulaması <strong>ayrı oturumlarda</strong> çalışır; siteye giriş yapmak masaüstü kasayı kapatmaz.
      </p>

      <div id="alert" class="portal-alert portal-alert-error" hidden></div>

      <form id="loginForm">
        <div class="portal-field">
          <label for="email">E-posta</label>
          <input id="email" name="email" type="email" autocomplete="username" placeholder="ornek@market.com" required />
          <label class="portal-field-foot portal-field-foot-left portal-remember">
            <input type="checkbox" id="rememberMe" name="rememberMe" />
            <span>E-postamı hatırla</span>
          </label>
        </div>
        <div class="portal-field">
          <label for="password">Şifre</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <p class="portal-field-foot portal-field-foot-right">
            <a href="sifremi-unuttum.html">Şifremi unuttum</a>
          </p>
        </div>
        <button class="btn btn-primary portal-submit" type="submit" id="submitBtn">Giriş yap</button>
      </form>

      <p class="portal-auth-links">
        <a href="kayit.html">Ücretsiz kayıt ol</a>
        ·
        <a href="../index.html">Ana sayfa</a>
      </p>
    </div>
  </div>

  <script src="portal.js?v=20260730"></script>
  <script src="../js/saas-ai-chat.js?v=20260730" defer></script>
  <script>
    (function () {
      var P = window.MarketPortal;
      if (P.redirectIfAuthed()) return;

      var alertEl = document.getElementById("alert");
      var rememberEl = document.getElementById("rememberMe");
      try {
        var saved = localStorage.getItem("marketpos-portal-remember");
        if (saved) {
          var parsed = JSON.parse(saved);
          if (parsed && parsed.email) {
            document.getElementById("email").value = parsed.email;
            rememberEl.checked = true;
          }
        }
      } catch (_) {}

      document.getElementById("loginForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        P.hideAlert(alertEl);
        var btn = document.getElementById("submitBtn");
        P.setLoading(btn, true, "Giriş yapılıyor…");
        try {
          var email = document.getElementById("email").value.trim();
          var data = await P.login(
            email,
            document.getElementById("password").value,
          );
          P.saveSession(data);
          try {
            if (rememberEl.checked) {
              localStorage.setItem("marketpos-portal-remember", JSON.stringify({ email: email }));
            } else {
              localStorage.removeItem("marketpos-portal-remember");
            }
          } catch (_) {}
          var next = new URLSearchParams(window.location.search).get("next") || "index.html";
          window.location.href = next;
        } catch (err) {
          P.showAlert(alertEl, err.error || "Giriş başarısız.");
        } finally {
          P.setLoading(btn, false);
        }
      });
    })();
  </script>
</body>
</html>
